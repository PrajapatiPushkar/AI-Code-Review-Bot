name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  whitespace:
    name: Whitespace & Hygiene Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Validate whitespace formatting
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Validating pull request changes for whitespace errors between base (${{ github.event.pull_request.base.sha }}) and head (${{ github.event.pull_request.head.sha }})..."
            git diff --check ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}
          elif [ "${{ github.event_name }}" = "push" ]; then
            if [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
              echo "Validating push changes for whitespace errors between ${{ github.event.before }} and ${{ github.sha }}..."
              git diff --check ${{ github.event.before }}..${{ github.sha }}
            elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
              echo "Validating latest commit changes for whitespace errors (HEAD~1..HEAD)..."
              git diff --check HEAD~1..HEAD
            else
              echo "Validating initial commit changes for whitespace errors..."
              git diff --check 4b825dc642cb6eb9a060e54bf8d69288fbee4904..HEAD
            fi
          else
            echo "Validating working tree whitespace..."
            git diff --check
          fi

  backend:
    name: Backend Test Suite (Java 21)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: 'backend/pom.xml'

      - name: Execute Backend Tests
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress test

  frontend:
    name: Frontend Build (Node 20)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 20
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies cleanly
        working-directory: frontend
        run: npm ci

      - name: Build frontend bundle
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker Build & Compose Validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate Docker Compose configuration
        run: |
          echo "Validating Docker Compose configurations..."

          # Validate development configuration syntax and structure (suppress resolved config output to prevent secret leakage)
          docker compose -f docker-compose.yml config --quiet

          # Validate production configuration syntax and structure
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet

          # Verify that development Compose includes expected services
          DEV_SERVICES=$(docker compose -f docker-compose.yml config --services)
          for SERVICE in postgres backend frontend; do
            if ! echo "$DEV_SERVICES" | grep -E "(^|[[:space:]])${SERVICE}([[:space:]]|$)"; then
              echo "Error: Expected service '$SERVICE' not found in development compose configuration"
              exit 1
            fi
          done
          echo "Base Compose services verified: postgres, backend, frontend"

          # Verify that production Compose includes expected services
          PROD_SERVICES=$(docker compose -f docker-compose.yml -f docker-compose.prod.yml config --services)
          for SERVICE in postgres backend frontend; do
            if ! echo "$PROD_SERVICES" | grep -E "(^|[[:space:]])${SERVICE}([[:space:]]|$)"; then
              echo "Error: Expected service '$SERVICE' not found in production compose configuration"
              exit 1
            fi
          done
          echo "Production Compose services verified: postgres, backend, frontend"

          # Verify production configuration does not expose PostgreSQL port on host
          if command -v jq >/dev/null 2>&1; then
            POSTGRES_PORTS_COUNT=$(docker compose -f docker-compose.yml -f docker-compose.prod.yml config --format json | jq -r '.services.postgres.ports // [] | length')
          else
            POSTGRES_PORTS_COUNT=$(docker compose -f docker-compose.yml -f docker-compose.prod.yml config --format json | python3 -c "import sys, json; data=json.load(sys.stdin); print(len(data.get('services', {}).get('postgres', {}).get('ports') or []))")
          fi

          if [ "$POSTGRES_PORTS_COUNT" != "0" ]; then
            echo "Security Error: PostgreSQL publishes host ports in production Compose configuration!"
            exit 1
          fi
          echo "Production security check passed: PostgreSQL host ports are completely unexposed (count: 0)"

      - name: Build backend Docker image
        run: |
          echo "Building backend container image with Maven multi-stage build..."
          docker build \
            --tag ai-code-review-backend:ci-validate \
            --file backend/Dockerfile \
            backend

      - name: Build frontend Docker image
        run: |
          echo "Building frontend container image with Vite/Nginx reverse proxy configuration..."
          docker build \
            --build-arg VITE_API_BASE_URL=/api/v1 \
            --tag ai-code-review-frontend:ci-validate \
            --file frontend/Dockerfile \
            frontend

      - name: Generate CycloneDX SBOM for backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'ai-code-review-backend:ci-validate'
          format: 'cyclonedx'
          output: 'sbom-backend-cyclonedx.json'

      - name: Generate CycloneDX SBOM for frontend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: success() || failure()
        with:
          image-ref: 'ai-code-review-frontend:ci-validate'
          format: 'cyclonedx'
          output: 'sbom-frontend-cyclonedx.json'

      - name: Scan backend Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: success() || failure()
        with:
          image-ref: 'ai-code-review-backend:ci-validate'
          format: 'json'
          output: 'trivy-backend-results.json'
          severity: 'CRITICAL,HIGH'
          trivyignores: '.trivyignore'

      - name: Scan frontend Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: success() || failure()
        with:
          image-ref: 'ai-code-review-frontend:ci-validate'
          format: 'json'
          output: 'trivy-frontend-results.json'
          severity: 'CRITICAL,HIGH'
          trivyignores: '.trivyignore'

      - name: Upload Security Reports and SBOM Artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: always()
        with:
          name: container-security-reports-and-sboms-ci
          path: |
            sbom-backend-cyclonedx.json
            sbom-frontend-cyclonedx.json
            trivy-backend-results.json
            trivy-frontend-results.json
          retention-days: 14

      - name: Audit Vulnerability Scan Results and Enforce Security Gate
        if: success() || failure()
        run: |
          python3 - << 'EOF'
          import datetime
          import json
          import os
          import re
          import sys

          def validate_trivyignore(path='.trivyignore'):
              print("========================================================")
              print(" Validating .trivyignore Exception Policy")
              print("========================================================")
              if not os.path.exists(path):
                  print(f"No ignore file found at '{path}'. Proceeding with default zero-exception policy.")
                  return set()

              with open(path, 'r', encoding='utf-8') as f:
                  lines = f.readlines()

              approved_exceptions = set()
              today = datetime.datetime.now(datetime.timezone.utc).date()
              has_errors = False

              for idx, raw_line in enumerate(lines, 1):
                  line = raw_line.strip()
                  if not line or line.startswith('#'):
                      continue

                  parts = line.split('#', 1)
                  rule_part = parts[0].strip()
                  comment_part = parts[1].strip() if len(parts) > 1 else ""

                  tokens = rule_part.split()
                  if not tokens:
                      continue
                  vuln_id = tokens[0]

                  expiry_match = re.search(r'exp:(\d{4}-\d{2}-\d{2})', rule_part) or re.search(r'\[EXPIRY=(\d{4}-\d{2}-\d{2})\]', comment_part)
                  if not expiry_match:
                      print(f"::error::.trivyignore line {idx}: Missing required expiration date (exp:YYYY-MM-DD or [EXPIRY=YYYY-MM-DD]) for '{vuln_id}'.")
                      has_errors = True
                      continue

                  expiry_str = expiry_match.group(1)
                  try:
                      expiry_date = datetime.date.fromisoformat(expiry_str)
                  except ValueError:
                      print(f"::error::.trivyignore line {idx}: Invalid expiration date format '{expiry_str}' for '{vuln_id}'. Expected YYYY-MM-DD.")
                      has_errors = True
                      continue

                  if expiry_date < today:
                      print(f"::error::.trivyignore line {idx}: Exception for '{vuln_id}' expired on {expiry_date} (today: {today}). Expired exceptions are rejected.")
                      has_errors = True
                      continue

                  approver_match = re.search(r'\[APPROVER=([^\]]+)\]', comment_part)
                  if not approver_match or not approver_match.group(1).strip():
                      print(f"::error::.trivyignore line {idx}: Missing required maintainer approver ([APPROVER=username]) for '{vuln_id}'.")
                      has_errors = True
                      continue

                  justification = re.sub(r'\[EXPIRY=[^\]]+\]', '', comment_part)
                  justification = re.sub(r'\[APPROVER=[^\]]+\]', '', justification).strip()
                  if not justification:
                      print(f"::error::.trivyignore line {idx}: Missing documented justification for '{vuln_id}'.")
                      has_errors = True
                      continue

                  approved_exceptions.add(vuln_id)
                  print(f" - Validated exception: {vuln_id} (Expires: {expiry_date}, Approver: {approver_match.group(1).strip()})")

              if has_errors:
                  print("\n::error::Security Gate FAILED: .trivyignore validation failed. All exceptions must have unexpired dates, approvers, and justifications.")
                  sys.exit(1)

              print(f"Validated {len(approved_exceptions)} approved, unexpired exception(s).")
              return approved_exceptions

          def parse_report(path, service_name):
              print(f"\n========================================================")
              print(f" Security Vulnerability Findings: {service_name}")
              print(f"========================================================")
              if not os.path.exists(path):
                  print(f"::error::Required vulnerability scan report '{path}' was not generated. Scan step may have failed.")
                  sys.exit(1)

              try:
                  with open(path, 'r', encoding='utf-8') as f:
                      data = json.load(f)
              except Exception as e:
                  print(f"::error::Failed to parse scan report '{path}': {e}")
                  sys.exit(1)

              crit_fixed, crit_unfixed = 0, 0
              high_fixed, high_unfixed = 0, 0
              findings = []

              for target in data.get('Results', []) or []:
                  t_name = target.get('Target', 'unknown')
                  for vuln in target.get('Vulnerabilities', []) or []:
                      vid = vuln.get('VulnerabilityID', 'UNKNOWN')
                      pkg = vuln.get('PkgName', 'UNKNOWN')
                      installed = vuln.get('InstalledVersion', 'UNKNOWN')
                      fixed = vuln.get('FixedVersion', '')
                      sev = vuln.get('Severity', 'UNKNOWN')

                      if sev == 'CRITICAL':
                          if fixed:
                              crit_fixed += 1
                          else:
                              crit_unfixed += 1
                      elif sev == 'HIGH':
                          if fixed:
                              high_fixed += 1
                          else:
                              high_unfixed += 1

                      findings.append({
                          'target': t_name,
                          'id': vid,
                          'pkg': pkg,
                          'installed': installed,
                          'fixed': fixed if fixed else 'None (unfixed)',
                          'severity': sev
                      })

              if not findings:
                  print(f"No CRITICAL or HIGH vulnerabilities detected in {service_name}.")
              else:
                  print(f"Total findings for {service_name}: {len(findings)}")
                  for item in findings:
                      status = f"Fix available: {item['fixed']}" if item['fixed'] != 'None (unfixed)' else "No upstream fix yet"
                      print(f" - [{item['severity']}] {item['pkg']} {item['installed']} ({item['id']}) | {status} | Target: {item['target']}")

              print(f"\nSummary for {service_name}:")
              print(f" - Fixable CRITICAL: {crit_fixed}")
              print(f" - Unfixed CRITICAL: {crit_unfixed}")
              print(f" - Fixable HIGH:     {high_fixed}")
              print(f" - Unfixed HIGH:     {high_unfixed}")

              return crit_fixed, crit_unfixed, high_fixed, high_unfixed

          validate_trivyignore('.trivyignore')

          b_cf, b_cu, b_hf, b_hu = parse_report('trivy-backend-results.json', 'Backend Container Image')
          f_cf, f_cu, f_hf, f_hu = parse_report('trivy-frontend-results.json', 'Frontend Container Image')

          total_crit_fixed = b_cf + f_cf
          total_crit_unfixed = b_cu + f_cu
          total_crit = total_crit_fixed + total_crit_unfixed
          total_high_fixed = b_hf + f_hf
          total_high_unfixed = b_hu + f_hu

          print("\n========================================================")
          print(" Vulnerability Policy Gate Evaluation")
          print("========================================================")
          print(f"Total Fixable CRITICAL Findings: {total_crit_fixed}")
          print(f"Total Unfixed CRITICAL Findings: {total_crit_unfixed}")
          print(f"Total Combined CRITICAL Findings: {total_crit}")
          print(f"Total Fixable HIGH Findings:     {total_high_fixed}")
          print(f"Total Unfixed HIGH Findings:     {total_high_unfixed}")

          if total_crit > 0:
              print(f"\n::error::Security Gate FAILED: Detected {total_crit} CRITICAL vulnerability(ies) ({total_crit_fixed} fixable, {total_crit_unfixed} unfixed). All CRITICAL vulnerabilities fail the security gate by default unless an approved, unexpired exception is documented in .trivyignore.")
              sys.exit(1)

          if total_high_fixed > 0:
              print(f"\n::warning::Detected {total_high_fixed} fixable HIGH vulnerability(ies). Review and schedule dependency upgrades.")

          print("\nSecurity gate policy check passed successfully.")
          EOF
