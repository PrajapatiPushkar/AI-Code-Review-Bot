name: Release Readiness & Versioned Image Preparation

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Semantic release version (e.g. 2.0.0-rc1, 2.0.0). Leave blank for commit SHA-only verification.'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-inputs:
    name: Validate Release Inputs
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.version-calc.outputs.short_sha }}
      release_version: ${{ steps.version-calc.outputs.release_version }}
      has_release_version: ${{ steps.version-calc.outputs.has_release_version }}
      backend_sha_tag: ${{ steps.version-calc.outputs.backend_sha_tag }}
      frontend_sha_tag: ${{ steps.version-calc.outputs.frontend_sha_tag }}
      backend_version_tag: ${{ steps.version-calc.outputs.backend_version_tag }}
      frontend_version_tag: ${{ steps.version-calc.outputs.frontend_version_tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate Release Version Input
        id: version-calc
        run: |
          RAW_VERSION="${{ github.event.inputs.release_version }}"
          VERSION=$(echo "$RAW_VERSION" | xargs)
          SHORT_SHA=$(git rev-parse --short=7 HEAD)

          echo "Short SHA: $SHORT_SHA"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "backend_sha_tag=ai-code-review-backend:$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "frontend_sha_tag=ai-code-review-frontend:$SHORT_SHA" >> "$GITHUB_OUTPUT"

          if [ -n "$VERSION" ]; then
            # Guard against overwriting or conflicting with v1.0.0 release history
            if [ "$VERSION" = "1.0.0" ] || [ "$VERSION" = "v1.0.0" ]; then
              echo "::error::Release version '$VERSION' conflicts with existing release tag v1.0.0. The v1.0.0 release tag and history must remain untouched."
              exit 1
            fi

            # Validate Semantic Version format: optional leading 'v', major.minor.patch, optional -prerelease (+build metadata optional)
            SEMVER_REGEX="^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$"
            if ! echo "$VERSION" | grep -Eq "$SEMVER_REGEX"; then
              echo "::error::Invalid release version '$VERSION'. Must follow Semantic Versioning (e.g., 2.0.0, v2.0.0, 2.0.0-rc1)."
              exit 1
            fi

            echo "Valid release version detected: $VERSION"
            echo "release_version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "has_release_version=true" >> "$GITHUB_OUTPUT"
            echo "backend_version_tag=ai-code-review-backend:$VERSION" >> "$GITHUB_OUTPUT"
            echo "frontend_version_tag=ai-code-review-frontend:$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "No release version specified; proceeding with commit SHA verification only."
            echo "release_version=" >> "$GITHUB_OUTPUT"
            echo "has_release_version=false" >> "$GITHUB_OUTPUT"
            echo "backend_version_tag=" >> "$GITHUB_OUTPUT"
            echo "frontend_version_tag=" >> "$GITHUB_OUTPUT"
          fi

  backend:
    name: Backend Test Suite (Java 21)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: 'backend/pom.xml'

      - name: Execute Backend Tests
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress test

  frontend:
    name: Frontend Build (Node 20)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 20
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies cleanly
        working-directory: frontend
        run: npm ci

      - name: Build frontend bundle
        working-directory: frontend
        run: npm run build

  docker-verification:
    name: Docker Build & Compose Validation
    runs-on: ubuntu-latest
    needs: [validate-inputs, backend, frontend]
    outputs:
      compose_status: ${{ steps.compose-check.outputs.status }}
      backend_images: ${{ steps.build-backend.outputs.tags }}
      frontend_images: ${{ steps.build-frontend.outputs.tags }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate Docker Compose configuration
        id: compose-check
        run: |
          echo "Validating Docker Compose configurations..."

          # Validate development configuration syntax and structure (suppress resolved config output to prevent secret leakage)
          docker compose -f docker-compose.yml config --quiet

          # Validate production configuration syntax and structure
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet

          # Verify that development Compose includes expected services
          DEV_SERVICES=$(docker compose -f docker-compose.yml config --services)
          for SERVICE in postgres backend frontend; do
            if ! echo "$DEV_SERVICES" | grep -E "(^|[[:space:]])${SERVICE}([[:space:]]|$)"; then
              echo "Error: Expected service '$SERVICE' not found in development compose configuration"
              exit 1
            fi
          done
          echo "Base Compose services verified: postgres, backend, frontend"

          # Verify that production Compose includes expected services
          PROD_SERVICES=$(docker compose -f docker-compose.yml -f docker-compose.prod.yml config --services)
          for SERVICE in postgres backend frontend; do
            if ! echo "$PROD_SERVICES" | grep -E "(^|[[:space:]])${SERVICE}([[:space:]]|$)"; then
              echo "Error: Expected service '$SERVICE' not found in production compose configuration"
              exit 1
            fi
          done
          echo "Production Compose services verified: postgres, backend, frontend"

          # Verify production configuration does not expose PostgreSQL port on host
          if command -v jq >/dev/null 2>&1; then
            POSTGRES_PORTS_COUNT=$(docker compose -f docker-compose.yml -f docker-compose.prod.yml config --format json | jq -r '.services.postgres.ports // [] | length')
          else
            POSTGRES_PORTS_COUNT=$(docker compose -f docker-compose.yml -f docker-compose.prod.yml config --format json | python3 -c "import sys, json; data=json.load(sys.stdin); print(len(data.get('services', {}).get('postgres', {}).get('ports') or []))")
          fi

          if [ "$POSTGRES_PORTS_COUNT" != "0" ]; then
            echo "Security Error: PostgreSQL publishes host ports in production Compose configuration!"
            exit 1
          fi
          echo "Production security check passed: PostgreSQL host ports are completely unexposed (count: 0)"
          echo "status=passed" >> "$GITHUB_OUTPUT"

      - name: Build versioned backend Docker image
        id: build-backend
        run: |
          BACKEND_TAGS="-t ${{ needs.validate-inputs.outputs.backend_sha_tag }}"
          IMAGE_TAG_LIST="${{ needs.validate-inputs.outputs.backend_sha_tag }}"

          if [ "${{ needs.validate-inputs.outputs.has_release_version }}" = "true" ]; then
            BACKEND_TAGS="$BACKEND_TAGS -t ${{ needs.validate-inputs.outputs.backend_version_tag }}"
            IMAGE_TAG_LIST="$IMAGE_TAG_LIST, ${{ needs.validate-inputs.outputs.backend_version_tag }}"
          fi

          echo "Building backend container image with tags: $IMAGE_TAG_LIST"
          docker build $BACKEND_TAGS --file backend/Dockerfile backend

          # Verify image existence in local daemon
          docker image inspect "${{ needs.validate-inputs.outputs.backend_sha_tag }}" > /dev/null
          echo "tags=$IMAGE_TAG_LIST" >> "$GITHUB_OUTPUT"

      - name: Build versioned frontend Docker image
        id: build-frontend
        run: |
          FRONTEND_TAGS="-t ${{ needs.validate-inputs.outputs.frontend_sha_tag }}"
          IMAGE_TAG_LIST="${{ needs.validate-inputs.outputs.frontend_sha_tag }}"

          if [ "${{ needs.validate-inputs.outputs.has_release_version }}" = "true" ]; then
            FRONTEND_TAGS="$FRONTEND_TAGS -t ${{ needs.validate-inputs.outputs.frontend_version_tag }}"
            IMAGE_TAG_LIST="$IMAGE_TAG_LIST, ${{ needs.validate-inputs.outputs.frontend_version_tag }}"
          fi

          echo "Building frontend container image with tags: $IMAGE_TAG_LIST"
          docker build --build-arg VITE_API_BASE_URL=/api/v1 $FRONTEND_TAGS --file frontend/Dockerfile frontend

          # Verify image existence in local daemon
          docker image inspect "${{ needs.validate-inputs.outputs.frontend_sha_tag }}" > /dev/null
          echo "tags=$IMAGE_TAG_LIST" >> "$GITHUB_OUTPUT"

      - name: List built local images
        run: |
          echo "Verifying prepared local container images:"
          docker images --filter "reference=ai-code-review-*" --format "table {{.Repository}}\t{{.Tag}}\t{{.ID}}\t{{.Size}}"

      - name: Generate CycloneDX SBOM for backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ needs.validate-inputs.outputs.backend_sha_tag }}
          format: 'cyclonedx'
          output: 'sbom-backend-cyclonedx.json'

      - name: Generate CycloneDX SBOM for frontend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: success() || failure()
        with:
          image-ref: ${{ needs.validate-inputs.outputs.frontend_sha_tag }}
          format: 'cyclonedx'
          output: 'sbom-frontend-cyclonedx.json'

      - name: Scan backend Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: success() || failure()
        with:
          image-ref: ${{ needs.validate-inputs.outputs.backend_sha_tag }}
          format: 'json'
          output: 'trivy-backend-results.json'
          severity: 'CRITICAL,HIGH'
          trivyignores: '.trivyignore'

      - name: Scan frontend Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: success() || failure()
        with:
          image-ref: ${{ needs.validate-inputs.outputs.frontend_sha_tag }}
          format: 'json'
          output: 'trivy-frontend-results.json'
          severity: 'CRITICAL,HIGH'
          trivyignores: '.trivyignore'

      - name: Upload Security Reports and SBOM Artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: always()
        with:
          name: release-security-reports-and-sboms
          path: |
            sbom-backend-cyclonedx.json
            sbom-frontend-cyclonedx.json
            trivy-backend-results.json
            trivy-frontend-results.json
          retention-days: 14

      - name: Audit Vulnerability Scan Results and Enforce Security Gate
        if: success() || failure()
        run: |
          python3 - << 'EOF'
          import datetime
          import json
          import os
          import re
          import sys

          def validate_trivyignore(path='.trivyignore'):
              print("========================================================")
              print(" Validating .trivyignore Exception Policy")
              print("========================================================")
              if not os.path.exists(path):
                  print(f"No ignore file found at '{path}'. Proceeding with default zero-exception policy.")
                  return set()

              with open(path, 'r', encoding='utf-8') as f:
                  lines = f.readlines()

              approved_exceptions = set()
              today = datetime.datetime.now(datetime.timezone.utc).date()
              has_errors = False

              for idx, raw_line in enumerate(lines, 1):
                  line = raw_line.strip()
                  if not line or line.startswith('#'):
                      continue

                  parts = line.split('#', 1)
                  rule_part = parts[0].strip()
                  comment_part = parts[1].strip() if len(parts) > 1 else ""

                  tokens = rule_part.split()
                  if not tokens:
                      continue
                  vuln_id = tokens[0]

                  expiry_match = re.search(r'exp:(\d{4}-\d{2}-\d{2})', rule_part) or re.search(r'\[EXPIRY=(\d{4}-\d{2}-\d{2})\]', comment_part)
                  if not expiry_match:
                      print(f"::error::.trivyignore line {idx}: Missing required expiration date (exp:YYYY-MM-DD or [EXPIRY=YYYY-MM-DD]) for '{vuln_id}'.")
                      has_errors = True
                      continue

                  expiry_str = expiry_match.group(1)
                  try:
                      expiry_date = datetime.date.fromisoformat(expiry_str)
                  except ValueError:
                      print(f"::error::.trivyignore line {idx}: Invalid expiration date format '{expiry_str}' for '{vuln_id}'. Expected YYYY-MM-DD.")
                      has_errors = True
                      continue

                  if expiry_date < today:
                      print(f"::error::.trivyignore line {idx}: Exception for '{vuln_id}' expired on {expiry_date} (today: {today}). Expired exceptions are rejected.")
                      has_errors = True
                      continue

                  approver_match = re.search(r'\[APPROVER=([^\]]+)\]', comment_part)
                  if not approver_match or not approver_match.group(1).strip():
                      print(f"::error::.trivyignore line {idx}: Missing required maintainer approver ([APPROVER=username]) for '{vuln_id}'.")
                      has_errors = True
                      continue

                  justification = re.sub(r'\[EXPIRY=[^\]]+\]', '', comment_part)
                  justification = re.sub(r'\[APPROVER=[^\]]+\]', '', justification).strip()
                  if not justification:
                      print(f"::error::.trivyignore line {idx}: Missing documented justification for '{vuln_id}'.")
                      has_errors = True
                      continue

                  approved_exceptions.add(vuln_id)
                  print(f" - Validated exception: {vuln_id} (Expires: {expiry_date}, Approver: {approver_match.group(1).strip()})")

              if has_errors:
                  print("\n::error::Security Gate FAILED: .trivyignore validation failed. All exceptions must have unexpired dates, approvers, and justifications.")
                  sys.exit(1)

              print(f"Validated {len(approved_exceptions)} approved, unexpired exception(s).")
              return approved_exceptions

          def parse_report(path, service_name):
              print(f"\n========================================================")
              print(f" Security Vulnerability Findings: {service_name}")
              print(f"========================================================")
              if not os.path.exists(path):
                  print(f"::error::Required vulnerability scan report '{path}' was not generated. Scan step may have failed.")
                  sys.exit(1)

              try:
                  with open(path, 'r', encoding='utf-8') as f:
                      data = json.load(f)
              except Exception as e:
                  print(f"::error::Failed to parse scan report '{path}': {e}")
                  sys.exit(1)

              crit_fixed, crit_unfixed = 0, 0
              high_fixed, high_unfixed = 0, 0
              findings = []

              for target in data.get('Results', []) or []:
                  t_name = target.get('Target', 'unknown')
                  for vuln in target.get('Vulnerabilities', []) or []:
                      vid = vuln.get('VulnerabilityID', 'UNKNOWN')
                      pkg = vuln.get('PkgName', 'UNKNOWN')
                      installed = vuln.get('InstalledVersion', 'UNKNOWN')
                      fixed = vuln.get('FixedVersion', '')
                      sev = vuln.get('Severity', 'UNKNOWN')

                      if sev == 'CRITICAL':
                          if fixed:
                              crit_fixed += 1
                          else:
                              crit_unfixed += 1
                      elif sev == 'HIGH':
                          if fixed:
                              high_fixed += 1
                          else:
                              high_unfixed += 1

                      findings.append({
                          'target': t_name,
                          'id': vid,
                          'pkg': pkg,
                          'installed': installed,
                          'fixed': fixed if fixed else 'None (unfixed)',
                          'severity': sev
                      })

              if not findings:
                  print(f"No CRITICAL or HIGH vulnerabilities detected in {service_name}.")
              else:
                  print(f"Total findings for {service_name}: {len(findings)}")
                  for item in findings:
                      status = f"Fix available: {item['fixed']}" if item['fixed'] != 'None (unfixed)' else "No upstream fix yet"
                      print(f" - [{item['severity']}] {item['pkg']} {item['installed']} ({item['id']}) | {status} | Target: {item['target']}")

              print(f"\nSummary for {service_name}:")
              print(f" - Fixable CRITICAL: {crit_fixed}")
              print(f" - Unfixed CRITICAL: {crit_unfixed}")
              print(f" - Fixable HIGH:     {high_fixed}")
              print(f" - Unfixed HIGH:     {high_unfixed}")

              return crit_fixed, crit_unfixed, high_fixed, high_unfixed

          validate_trivyignore('.trivyignore')

          b_cf, b_cu, b_hf, b_hu = parse_report('trivy-backend-results.json', 'Backend Container Image')
          f_cf, f_cu, f_hf, f_hu = parse_report('trivy-frontend-results.json', 'Frontend Container Image')

          total_crit_fixed = b_cf + f_cf
          total_crit_unfixed = b_cu + f_cu
          total_crit = total_crit_fixed + total_crit_unfixed
          total_high_fixed = b_hf + f_hf
          total_high_unfixed = b_hu + f_hu

          print("\n========================================================")
          print(" Vulnerability Policy Gate Evaluation")
          print("========================================================")
          print(f"Total Fixable CRITICAL Findings: {total_crit_fixed}")
          print(f"Total Unfixed CRITICAL Findings: {total_crit_unfixed}")
          print(f"Total Combined CRITICAL Findings: {total_crit}")
          print(f"Total Fixable HIGH Findings:     {total_high_fixed}")
          print(f"Total Unfixed HIGH Findings:     {total_high_unfixed}")

          if total_crit > 0:
              print(f"\n::error::Security Gate FAILED: Detected {total_crit} CRITICAL vulnerability(ies) ({total_crit_fixed} fixable, {total_crit_unfixed} unfixed). All CRITICAL vulnerabilities fail the security gate by default unless an approved, unexpired exception is documented in .trivyignore.")
              sys.exit(1)

          if total_high_fixed > 0:
              print(f"\n::warning::Detected {total_high_fixed} fixable HIGH vulnerability(ies). Review and schedule dependency upgrades.")

          print("\nSecurity gate policy check passed successfully.")
          EOF

  summary:
    name: Release Readiness Manifest
    runs-on: ubuntu-latest
    needs: [validate-inputs, backend, frontend, docker-verification]
    if: always()
    steps:
      - name: Generate Non-Secret Release Readiness Summary
        run: |
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${{ needs.validate-inputs.outputs.short_sha || 'N/A' }}"
          RELEASE_VER="${{ needs.validate-inputs.outputs.release_version || 'None (commit SHA-only verification)' }}"
          REF_NAME="${{ github.ref_name }}"

          VAL_INPUT_RES="${{ needs.validate-inputs.result }}"
          BACKEND_RES="${{ needs.backend.result }}"
          FRONTEND_RES="${{ needs.frontend.result }}"
          DOCKER_RES="${{ needs.docker-verification.result }}"

          BACKEND_TAGS="${{ needs.docker-verification.outputs.backend_images || 'Not built' }}"
          FRONTEND_TAGS="${{ needs.docker-verification.outputs.frontend_images || 'Not built' }}"

          if [ "$VAL_INPUT_RES" = "success" ] && [ "$BACKEND_RES" = "success" ] && [ "$FRONTEND_RES" = "success" ] && [ "$DOCKER_RES" = "success" ]; then
            OVERALL_STATUS="READY FOR RELEASE"
          else
            OVERALL_STATUS="BLOCKED"
          fi

          cat << 'EOF' | sed 's/^          //' > release-summary.md
          # Release Readiness & Versioned Image Manifest

          ## Overview
          EOF

          echo "- **Status**: $OVERALL_STATUS" >> release-summary.md
          echo "- **Git Commit**: \`$COMMIT_SHA\` (short: \`$SHORT_SHA\`)" >> release-summary.md
          echo "- **Git Branch / Ref**: \`$REF_NAME\`" >> release-summary.md
          echo "- **Requested Release Version**: \`$RELEASE_VER\`" >> release-summary.md
          echo "- **Workflow Run**: [Run #${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> release-summary.md

          cat << 'EOF' | sed 's/^          //' >> release-summary.md

          ## Quality Gate Verification Summary

          | Quality Gate | Job | Result | Scope / Details |
          |---|---|---|---|
          EOF

          echo "| Release Input Validation | \`validate-inputs\` | $VAL_INPUT_RES | SemVer regex check and v1.0.0 collision prevention |" >> release-summary.md
          echo "| Backend Test Suite | \`backend\` | $BACKEND_RES | Java 21 Temurin, Maven batch test suite |" >> release-summary.md
          echo "| Frontend Production Build | \`frontend\` | $FRONTEND_RES | Node 20 LTS, npm ci, Vite production build |" >> release-summary.md
          echo "| Docker Compose & Port Isolation | \`docker-verification\` | $DOCKER_RES | Dev & prod configs, service integrity, postgres port isolation |" >> release-summary.md
          echo "| Multi-stage Image Builds | \`docker-verification\` | $DOCKER_RES | Backend and frontend Docker images built locally |" >> release-summary.md
          echo "| Container Vulnerability Scanning | \`docker-verification\` | $DOCKER_RES | Trivy scan for CRITICAL/HIGH CVEs on candidate container images |" >> release-summary.md
          echo "| CycloneDX SBOM Generation | \`docker-verification\` | $DOCKER_RES | Component inventories generated for candidate backend & frontend images |" >> release-summary.md

          cat << 'EOF' | sed 's/^          //' >> release-summary.md

          ## Local Versioned Docker Images Prepared

          EOF

          echo "- **Backend Image Tags**: \`$BACKEND_TAGS\`" >> release-summary.md
          echo "- **Frontend Image Tags**: \`$FRONTEND_TAGS\`" >> release-summary.md

          cat << 'EOF' | sed 's/^          //' >> release-summary.md

          ## Security & SBOM Artifacts Generated

          - **Artifact Bundle**: \`release-security-reports-and-sboms\` (retention: 14 days)
            - \`sbom-backend-cyclonedx.json\`: CycloneDX Software Bill of Materials for backend container image
            - \`sbom-frontend-cyclonedx.json\`: CycloneDX Software Bill of Materials for frontend container image
            - \`trivy-backend-results.json\`: Machine-readable Trivy vulnerability report for backend container image
            - \`trivy-frontend-results.json\`: Machine-readable Trivy vulnerability report for frontend container image

          ## Release & Security Safeguards

          > [!IMPORTANT]
          > **Release Boundary Notice**:
          > - This workflow is a **dry-run release verification and readiness assessment**.
          > - **NO** Docker images were pushed or published to any registry (Docker Hub, GHCR, or private registries).
          > - **NO** Git tags were created or modified. The V1 release tag \`v1.0.0\` remains untouched.
          > - **NO** GitHub releases were generated.
          > - **NO** automated deployments or changes to production infrastructure were initiated.
          > - **NO** production secrets, credentials, or resolved Compose configurations were logged or exposed.
          > - Runtime production-equivalent verification must occur in a dedicated staging environment prior to final promotion.
          EOF

          cat release-summary.md >> "$GITHUB_STEP_SUMMARY"
          cat release-summary.md

      - name: Enforce Overall Readiness Gate
        run: |
          if [ "${{ needs.validate-inputs.result }}" != "success" ] || \
             [ "${{ needs.backend.result }}" != "success" ] || \
             [ "${{ needs.frontend.result }}" != "success" ] || \
             [ "${{ needs.docker-verification.result }}" != "success" ]; then
            echo "::error::One or more release readiness gates failed. Release readiness blocked."
            exit 1
          fi
          echo "All release readiness quality gates passed successfully."
