server:
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: ai-code-review-bot

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:code_review_bot}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres}}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

  jpa:
    database-platform: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: ${MANAGEMENT_HEALTH_SHOW_DETAILS:never}
      probes:
        enabled: true
    info:
      enabled: true
    metrics:
      enabled: true
    prometheus:
      enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: false

info:
  app:
    name: AI Code Review Bot
    description: AI Code Review Bot Backend Service
    version: 0.0.1-SNAPSHOT

github:
  app-id: ${GITHUB_APP_ID:}
  app-name: ${GITHUB_APP_NAME:ai-code-review-bot}
  private-key: ${GITHUB_PRIVATE_KEY:}
  private-key-path: ${GITHUB_PRIVATE_KEY_PATH:}
  webhook-secret: ${GITHUB_WEBHOOK_SECRET:}
  api-base-url: ${GITHUB_API_BASE_URL:https://api.github.com}

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-3.6-flash}
  api-base-url: ${GEMINI_API_BASE_URL:https://generativelanguage.googleapis.com}

jwt:
  secret: ${JWT_SECRET:defaultDevSecretKeyThatIsAtLeast32BytesLongForHMACSHA256Signatures12345}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  token-type: ${JWT_TOKEN_TYPE:Bearer}
  issuer: ${JWT_ISSUER:ai-code-review-bot}

resilience:
  retry:
    max-attempts: ${RETRY_MAX_ATTEMPTS:3}
    initial-interval-ms: ${RETRY_INITIAL_INTERVAL_MS:500}
    multiplier: ${RETRY_MULTIPLIER:2.0}
    max-interval-ms: ${RETRY_MAX_INTERVAL_MS:2000}
  circuit-breaker:
    failure-rate-threshold: ${CB_FAILURE_THRESHOLD:50.0}
    sliding-window-size: ${CB_SLIDING_WINDOW_SIZE:10}
    minimum-number-of-calls: ${CB_MIN_CALLS:5}
    wait-duration-in-open-state-ms: ${CB_WAIT_DURATION_MS:10000}
    permitted-number-of-calls-in-half-open-state: ${CB_HALF_OPEN_CALLS:3}
  timeouts:
    github-connect-timeout-ms: ${GITHUB_HTTP_CONNECT_TIMEOUT_MS:5000}
    github-read-timeout-ms: ${GITHUB_HTTP_READ_TIMEOUT_MS:15000}
    gemini-connect-timeout-ms: ${GEMINI_HTTP_CONNECT_TIMEOUT_MS:5000}
    gemini-read-timeout-ms: ${GEMINI_HTTP_READ_TIMEOUT_MS:60000}
