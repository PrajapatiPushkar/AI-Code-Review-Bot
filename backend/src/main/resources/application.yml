server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: ai-code-review-bot

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:code_review_bot}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always

github:
  app-id: ${GITHUB_APP_ID:}
  app-name: ${GITHUB_APP_NAME:ai-code-review-bot}
  private-key: ${GITHUB_PRIVATE_KEY:}
  webhook-secret: ${GITHUB_WEBHOOK_SECRET:}
  api-base-url: ${GITHUB_API_BASE_URL:https://api.github.com}

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-2.5-flash}
  api-base-url: ${GEMINI_API_BASE_URL:https://generativelanguage.googleapis.com}


