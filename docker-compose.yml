services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-code-review-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-code_review_bot}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-code_review_bot}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-code-review-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      PORT: ${PORT:-8080}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-code_review_bot}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-defaultDevSecretKeyThatIsAtLeast32BytesLongForHMACSHA256Signatures12345}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-4642046}
      GITHUB_PRIVATE_KEY: ${GITHUB_PRIVATE_KEY:-}
      GITHUB_PRIVATE_KEY_PATH: ${GITHUB_PRIVATE_KEY_PATH:-/app/secrets/github-app-private-key.pem}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-defaultWebhookSecret123}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      GEMINI_FALLBACK_MODEL: ${GEMINI_FALLBACK_MODEL:-gemini-3.5-flash}
      GEMINI_API_BASE_URL: ${GEMINI_API_BASE_URL:-https://generativelanguage.googleapis.com}
      WEBHOOK_RETRY_MAX_ATTEMPTS: ${WEBHOOK_RETRY_MAX_ATTEMPTS:-3}
      WEBHOOK_RETRY_INITIAL_INTERVAL_MS: ${WEBHOOK_RETRY_INITIAL_INTERVAL_MS:-60000}
      WEBHOOK_RETRY_MULTIPLIER: ${WEBHOOK_RETRY_MULTIPLIER:-2.0}
      WEBHOOK_RETRY_STALE_THRESHOLD_MS: ${WEBHOOK_RETRY_STALE_THRESHOLD_MS:-300000}
      WEBHOOK_RETRY_SCHEDULER_ENABLED: ${WEBHOOK_RETRY_SCHEDULER_ENABLED:-false}
      WEBHOOK_RETRY_SCHEDULER_FIXED_DELAY_MS: ${WEBHOOK_RETRY_SCHEDULER_FIXED_DELAY_MS:-60000}
    volumes:
      - ./secrets:/app/secrets:ro
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:${PORT:-8080}/api/v1/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    container_name: ai-code-review-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - app-network

volumes:
  postgres-data:
    driver: local

networks:
  app-network:
    driver: bridge
